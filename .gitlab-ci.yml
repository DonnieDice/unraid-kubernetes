stages:
  - test
  - package

default:
  image: alpine:3.22

test:
  stage: test
  before_script:
    - apk add --no-cache bash libxml2-utils nodejs php shellcheck
  script:
    - bash ./tools/test.sh

package:
  stage: package
  before_script:
    - apk add --no-cache bash coreutils libxml2-utils xz
  script:
    - bash ./tools/build.sh
    - bash ./tools/render-plg.sh
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

publish:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache bash coreutils curl libxml2-utils xz
  script:
    - bash ./tools/build.sh
    - bash ./tools/render-plg.sh
    - VERSION=$(tr -d '[:space:]' < VERSION)
    - PACKAGE="unraid.kubernetes-${VERSION}-noarch-1.txz"
    - REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/unraid.kubernetes/${VERSION}"
    - curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "dist/${PACKAGE}" "${REGISTRY}/${PACKAGE}"
    - curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file dist/unraid.kubernetes.plg "${REGISTRY}/unraid.kubernetes.plg"
